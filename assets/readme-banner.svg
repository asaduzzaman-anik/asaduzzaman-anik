<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Md Asaduzzaman Anik - Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <pattern id="icons" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="#ffffff" fill-opacity="0.07" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
        <text x="12" y="28">&lt;/&gt;</text>
        <text x="70" y="70">™</text>
        <text x="20" y="100"></text>
        <text x="80" y="30">{}</text>
      </g>
      <circle cx="100" cy="100" r="10" fill="#ffffff" fill-opacity="0.05"/>
      <rect x="40" y="40" width="22" height="16" rx="2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#icons)"/>

  <!-- Name -->
  <text x="600" y="130" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Md Asaduzzaman Anik</text>

  <!-- Role -->
  <text x="600" y="185" text-anchor="middle" fill="#E3F2FD" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" font-weight="600">=€ Full Stack Developer | Laravel · React | Educator</text>

  <!-- Tagline -->
  <text x="600" y="230" text-anchor="middle" fill="#BBDEFB" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="500">Build. Learn. Ship. Share.</text>

  <!-- Tech logo pills -->
  <g transform="translate(210, 280)">
    <!-- Laravel -->
    <rect x="0" y="0" width="110" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <text x="55" y="29" text-anchor="middle" fill="#FF2D20" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Laravel</text>

    <!-- React -->
    <rect x="125" y="0" width="100" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <text x="175" y="29" text-anchor="middle" fill="#61DAFB" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">React</text>

    <!-- PHP -->
    <rect x="240" y="0" width="80" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <text x="280" y="29" text-anchor="middle" fill="#B0BFFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">PHP</text>

    <!-- MySQL -->
    <rect x="335" y="0" width="100" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <text x="385" y="29" text-anchor="middle" fill="#7EC8E3" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">MySQL</text>

    <!-- Next.js -->
    <rect x="450" y="0" width="100" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <text x="500" y="29" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Next.js</text>

    <!-- JavaScript -->
    <rect x="565" y="0" width="120" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <text x="625" y="29" text-anchor="middle" fill="#F7DF1E" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">JavaScript</text>

    <!-- SQL -->
    <rect x="700" y="0" width="80" height="44" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <text x="740" y="29" text-anchor="middle" fill="#A5D6A7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">SQL</text>
  </g>
</svg>
